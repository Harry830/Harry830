<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="Hardik Saini — full-stack systems. Projects: TaskTrail, Stockd, RoomieManager, SpeechMate, Portfolio.">
  <title>Hardik Saini — full-stack systems</title>
  <desc>Editorial masthead. Deep ink background, warm paper typography, ember accent, project list.</desc>
  <defs>
    <pattern id="hs-grid-d" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e8dfd0" stroke-width="0.4" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Ink -->
  <rect width="1280" height="420" fill="#14110f"/>
  <rect width="1280" height="420" fill="url(#hs-grid-d)"/>

  <!-- Editorial keylines -->
  <rect x="40" y="40" width="1200" height="340" fill="none" stroke="#e8dfd0" stroke-width="0.6" opacity="0.35"/>
  <rect x="48" y="48" width="1184" height="324" fill="none" stroke="#e8dfd0" stroke-width="0.4" opacity="0.14"/>

  <!-- Top metadata -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#9a9085">
    <text x="72" y="78" font-size="11" letter-spacing="3.4">HARDIK SAINI  ·  CS @ GEORGIA STATE UNIVERSITY</text>
    <text x="1208" y="78" font-size="11" letter-spacing="3.4" text-anchor="end">GITHUB  ·  @HARRY830</text>
  </g>
  <line x1="72" y1="92" x2="1208" y2="92" stroke="#e8dfd0" stroke-width="1.4"/>
  <line x1="72" y1="98" x2="1208" y2="98" stroke="#e8dfd0" stroke-width="0.4"/>

  <!-- Wordmark -->
  <g font-family="Georgia, 'Times New Roman', 'Source Serif Pro', serif">
    <text x="72" y="208" font-size="88" font-weight="700" letter-spacing="-2" fill="#e8dfd0">HARDIK SAINI</text>
    <text x="72" y="258" font-size="20" font-style="italic" fill="#c8bfb1">Full-stack systems for messy real-world workflows.</text>
  </g>

  <!-- Layered ember accent -->
  <line x1="72" y1="226" x2="208" y2="226" stroke="#d4664f" stroke-width="3.4"/>
  <line x1="216" y1="226" x2="248" y2="226" stroke="#d4664f" stroke-width="3.4" opacity="0.55"/>
  <line x1="256" y1="226" x2="272" y2="226" stroke="#d4664f" stroke-width="3.4" opacity="0.28"/>

  <!-- Discipline strip -->
  <text x="72" y="294" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="3.4" fill="#9a9085">BACKEND  ·  PLATFORM  ·  DATA  ·  AI  ·  PRODUCT</text>

  <!-- HS monogram + microcopy lower-left -->
  <g transform="translate(72, 336)">
    <rect x="0" y="-14" width="22" height="22" fill="none" stroke="#e8dfd0" stroke-width="0.8" opacity="0.7"/>
    <text x="11" y="2.5" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#e8dfd0" text-anchor="middle">HS</text>
  </g>
  <text x="104" y="334" font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="2.6" fill="#9a9085">BACKEND  ·  AI  ·  CLOUD</text>

  <!-- SYSTEM INDEX (right column) -->
  <g transform="translate(820, 0)">
    <text x="0" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" letter-spacing="3.6" fill="#9a9085">— PROJECTS —</text>
    <text x="392" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" letter-spacing="3.2" fill="#9a9085" text-anchor="end">FIVE OF THEM</text>
    <line x1="0" y1="156" x2="392" y2="156" stroke="#e8dfd0" stroke-width="0.7" opacity="0.55"/>

    <!-- 01 TaskTrail -->
    <text x="0"   y="180" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2.4" fill="#9a9085">01</text>
    <text x="34"  y="180" font-family="Georgia, serif" font-size="16.5" font-weight="700" fill="#e8dfd0">TaskTrail</text>
    <text x="34"  y="195" font-family="ui-monospace, monospace" font-size="9" letter-spacing="2.4" fill="#9a9085">CLOUD  ·  WEB + MOBILE</text>
    <circle cx="388" cy="180" r="3.2" fill="#d4664f"/>
    <line x1="0" y1="208" x2="392" y2="208" stroke="#e8dfd0" stroke-width="0.3" opacity="0.22"/>

    <!-- 02 Stockd -->
    <text x="0"   y="226" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2.4" fill="#9a9085">02</text>
    <text x="34"  y="226" font-family="Georgia, serif" font-size="16.5" font-weight="700" fill="#e8dfd0">Stockd</text>
    <text x="34"  y="241" font-family="ui-monospace, monospace" font-size="9" letter-spacing="2.4" fill="#9a9085">AI  ·  OPERATOR DASHBOARDS</text>
    <circle cx="388" cy="226" r="3.2" fill="#d4664f"/>
    <line x1="0" y1="254" x2="392" y2="254" stroke="#e8dfd0" stroke-width="0.3" opacity="0.22"/>

    <!-- 03 RoomieManager -->
    <text x="0"   y="272" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2.4" fill="#9a9085">03</text>
    <text x="34"  y="272" font-family="Georgia, serif" font-size="16.5" font-weight="700" fill="#e8dfd0">RoomieManager</text>
    <text x="34"  y="287" font-family="ui-monospace, monospace" font-size="9" letter-spacing="2.4" fill="#9a9085">FULL-STACK  ·  DOMAIN + AUTH</text>
    <circle cx="388" cy="272" r="3.2" fill="#d4664f"/>
    <line x1="0" y1="300" x2="392" y2="300" stroke="#e8dfd0" stroke-width="0.3" opacity="0.22"/>

    <!-- 04 SpeechMate -->
    <text x="0"   y="318" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2.4" fill="#9a9085">04</text>
    <text x="34"  y="318" font-family="Georgia, serif" font-size="16.5" font-weight="700" fill="#e8dfd0">SpeechMate</text>
    <text x="34"  y="333" font-family="ui-monospace, monospace" font-size="9" letter-spacing="2.4" fill="#9a9085">MULTIMODAL AI  ·  COACH</text>
    <circle cx="388" cy="318" r="3.2" fill="#d4664f"/>
    <line x1="0" y1="346" x2="392" y2="346" stroke="#e8dfd0" stroke-width="0.3" opacity="0.22"/>

    <!-- 05 Portfolio -->
    <text x="0"   y="364" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2.4" fill="#9a9085">05</text>
    <text x="34"  y="364" font-family="Georgia, serif" font-size="16.5" font-weight="700" fill="#e8dfd0">Portfolio</text>
    <circle cx="388" cy="364" r="3.2" fill="#d4664f" opacity="0.55"/>
  </g>
</svg>
